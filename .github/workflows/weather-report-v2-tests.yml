name: Test weather reports

on:
  push:
    branches: [main]
    paths:
      - 'weather-report-v2/**'
      - 'weather-report-v3/**'
      - '.github/workflows/weather-report-v2-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'weather-report-v2/**'
      - 'weather-report-v3/**'
      - '.github/workflows/weather-report-v2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [weather-report-v2, weather-report-v3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
        working-directory: ${{ matrix.project }}
      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: ${{ matrix.project }}
      - name: Run tests
        run: npm test
        working-directory: ${{ matrix.project }}
